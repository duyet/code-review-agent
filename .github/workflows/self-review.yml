name: Self-Review on Push to Main

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/**'

jobs:
  review:
    name: Self-Review Codebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Build project
        run: bun run build

      - name: Run codebase self-review
        run: bun run review
        env:
          PROVIDER: openrouter:openrouter/auto
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        timeout-minutes: 10
        continue-on-error: true

      - name: Create GitHub Issue if review has critical issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Self-Review Failed: Code Quality Issues Detected',
              body: 'The self-review workflow detected critical issues during the push to main. Review the workflow run logs for details.',
              labels: ['bug', 'code-review']
            })
